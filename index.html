<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diagram+</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--color-background, #ffffff);
      color: var(--color-text, #040f1c);
      font-family: var(--font-body, sans-serif);
    }

    #app { position: relative; height: 100%; }
    #diagram-canvas { position: absolute; inset: 0; }
    #diagram-canvas svg { cursor: grab; }

    .dp-toolbar {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-width: calc(100vw - 24px);
      background: var(--color-surface, #f5f5f5);
      padding: 6px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }
    .dp-toolbar button {
      font-family: var(--font-body);
      background: transparent;
      color: var(--color-text, #040f1c);
      border: 1px solid var(--color-line, #8a8a8a);
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 13px;
    }
    .dp-toolbar button:hover { background: var(--color-accent, #96791d); color: var(--color-accent-contrast, #ffffff); }

    .dp-node rect {
      fill: var(--color-surface, #f5f5f5);
      stroke: var(--color-line, #8a8a8a);
      stroke-width: 1.5px;
    }
    .dp-node text {
      fill: var(--color-text, #040f1c);
      font-family: var(--font-body);
      font-size: 16px;
      user-select: none;
    }
    .dp-node.is-selected rect { stroke: var(--color-accent, #96791d); stroke-width: 3px; }
    .dp-node.is-locked rect { stroke-dasharray: 4 3; }
    .dp-node.is-dragging { opacity: 0.6; cursor: grabbing; }
    .dp-node.is-drop-target rect { stroke: var(--color-accent, #96791d); stroke-width: 3px; }
    .dp-node.is-blocked rect { stroke: #e05252; stroke-width: 3px; transition: stroke 0.1s; }
    .dp-node.is-root rect { stroke-width: 2.5px; }
    .dp-node.is-header rect { fill: var(--color-accent, #96791d); stroke: none; }
    .dp-node.is-header text { fill: var(--color-accent-contrast, #ffffff); font-weight: 600; }
    .dp-toggle { fill: var(--color-accent, #96791d); cursor: pointer; }
    .dp-edge { fill: none; stroke: var(--color-line, #8a8a8a); stroke-width: 2px; }
    .dp-edge.dp-spine { stroke-width: 3px; }
    .dp-edge.dp-row-rule { stroke-width: 1px; opacity: 0.45; }
    .dp-edge.dp-link { stroke: var(--color-accent, #96791d); marker-end: url(#dp-arrowhead); }
    .dp-edge.dp-risk-link { stroke-dasharray: 6 5; stroke-width: 2px; }
    .dp-node.is-risk rect { stroke-dasharray: 6 5; stroke-width: 2px; }
    .dp-badge-label { font-size: 11px; font-weight: 600; fill: #111; font-family: var(--font-body); user-select: none; }

    .dp-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .dp-modal {
      background: var(--color-surface, #f5f5f5);
      color: var(--color-text, #040f1c);
      font-family: var(--font-body);
      border-radius: 10px;
      padding: 20px;
      width: min(420px, 90vw);
      max-height: 80vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .dp-modal h2 { margin: 0 0 4px; font-size: 16px; }
    .dp-modal label { font-size: 13px; display: block; }
    .dp-modal input, .dp-modal textarea {
      width: 100%;
      box-sizing: border-box;
      margin-top: 4px;
      background: var(--color-background, #ffffff);
      color: var(--color-text, #040f1c);
      border: 1px solid var(--color-line, #8a8a8a);
      border-radius: 6px;
      padding: 6px 8px;
      font-family: var(--font-body);
      font-size: 13px;
    }
    .dp-modal-list { display: flex; flex-direction: column; gap: 6px; }
    .dp-modal-item {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      text-align: left;
      background: var(--color-background, #ffffff);
      color: var(--color-text, #040f1c);
      border: 1px solid var(--color-line, #8a8a8a);
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
      font-family: var(--font-body);
    }
    .dp-modal-item:hover { border-color: var(--color-accent, #96791d); }
    .dp-modal-item span { font-size: 12px; opacity: 0.8; }
    .dp-preset-label { font-size: 12px; opacity: 0.75; }
    .dp-preset-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .dp-preset-chip {
      font-family: var(--font-body);
      background: var(--color-background, #ffffff);
      color: var(--color-text, #040f1c);
      border: 1px solid var(--color-line, #8a8a8a);
      border-left-width: 4px;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 12px;
      text-align: left;
    }
    .dp-preset-chip:hover { background: rgba(128, 128, 128, 0.15); }

    .dp-modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .dp-modal button, .dp-modal-cancel {
      font-family: var(--font-body);
      background: transparent;
      color: var(--color-text, #040f1c);
      border: 1px solid var(--color-line, #8a8a8a);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    .dp-modal-actions button:last-child { background: var(--color-accent, #96791d); color: var(--color-accent-contrast, #ffffff); border-color: transparent; }

    .dp-outline {
      position: fixed;
      top: 12px;
      right: 12px;
      bottom: 12px;
      width: 280px;
      z-index: 9;
      background: var(--color-surface, #f5f5f5);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .dp-outline-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px;
      border-bottom: 1px solid var(--color-line, #8a8a8a);
      color: var(--color-text, #040f1c);
      font-family: var(--font-body);
    }
    .dp-outline-header strong { flex: 1; font-size: 13px; }
    .dp-outline-header button {
      font-family: var(--font-body);
      background: transparent;
      color: var(--color-text, #040f1c);
      border: 1px solid var(--color-line, #8a8a8a);
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 11px;
    }
    .dp-outline-rows { flex: 1; overflow-y: auto; padding: 6px 0; }
    .dp-outline-row {
      display: flex;
      align-items: center;
      padding-top: 3px;
      padding-bottom: 3px;
      padding-right: 8px;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--color-text, #040f1c);
    }
    .dp-outline-row:hover { background: rgba(128, 128, 128, 0.15); }
    .dp-outline-row.is-selected { background: rgba(201, 162, 39, 0.2); }
    .dp-outline-text { outline: none; flex: 1; }

    body.is-presenting .dp-toolbar { display: none; }
    body.is-presenting .dp-outline { display: none !important; }
    body.is-presenting::after {
      content: 'กด Esc เพื่อออกจากโหมดนำเสนอ';
      position: fixed;
      bottom: 12px;
      right: 16px;
      color: var(--color-line, #8a8a8a);
      font-family: var(--font-body);
      font-size: 12px;
      opacity: 0.7;
      pointer-events: none;
    }

    .dp-node-edit {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      outline: none;
      border: none;
      background: var(--color-background, #ffffff);
      color: var(--color-text, #040f1c);
      font-family: var(--font-body);
      font-size: 16px;
      padding: 4px 8px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import {
      DocumentStore,
      createEmptyMindmap,
      getRecentList,
      loadFromLocalStorage,
      saveToLocalStorage,
      saveDocumentToFile,
      openDocumentFromFile,
    } from './src/core/store.js';
    import { History } from './src/core/history.js';
    import { Selection } from './src/core/selection.js';
    import { Canvas } from './src/core/canvas.js';
    import { attachKeyboard } from './src/core/keyboard.js';
    import { createToolbar } from './src/ui/toolbar.js';
    import { applyTheme } from './src/ui/theme.js';
    import { showTemplateGallery, showSaveAsTemplateForm, showHint, showSearchDialog } from './src/ui/dialogs.js';
    import { loadTemplateIndex, loadTemplateDoc, buildTemplateDoc } from './src/ui/templates.js';
    import { switchSide as switchMindmapSide, switchListItem as switchMindmapListItem } from './src/diagrams/mindmap.js';
    import { exportPngFile, exportSvgFile } from './src/export/png.js';
    import { copyDiagramToClipboard } from './src/export/clipboard.js';
    import { exportPdfFile } from './src/export/pdf.js';
    import { createOutlinePanel } from './src/ui/outline.js';
    import { exportInteractiveHtml } from './src/export/html-export.js';

    const appEl = document.getElementById('app');
    const canvasHost = document.createElement('div');
    canvasHost.id = 'diagram-canvas';
    appEl.appendChild(canvasHost);

    async function loadInitialDocument() {
      const recent = getRecentList();
      if (recent[0]) {
        const doc = loadFromLocalStorage(recent[0].id);
        if (doc) return doc;
      }
      try {
        return await loadTemplateDoc('mindmap-empty.json');
      } catch {
        return createEmptyMindmap();
      }
    }

    const initialDoc = await loadInitialDocument();
    const store = new DocumentStore(initialDoc);
    const selection = new Selection();
    const history = new History(200);
    history.init(store.doc);

    let fileHandle = null;

    const canvas = new Canvas(canvasHost, store, selection, {
      startEdit: (id) => selection.startEditing(id),
    });

    function render() {
      canvas.render();
    }

    let outlineController = null;
    let outlineVisible = false;

    function ensureOutline() {
      if (!outlineController) {
        outlineController = createOutlinePanel(document.body, store, selection, {
          onSelect: (id) => selection.select(id),
          onImport: (doc) => resetDocument(doc),
        });
        outlineController.panel.style.display = 'none';
      }
      return outlineController;
    }

    store.addEventListener('change', (e) => {
      saveToLocalStorage(store.doc);
      render();
      outlineController?.render();
      if (!e.detail?.silent) history.record(store.doc);
    });

    let presenting = false;

    function enterPresentation() {
      presenting = true;
      document.body.classList.add('is-presenting');
      document.documentElement.requestFullscreen?.().catch(() => {});
      if (selection.selectedId) canvas.centerOnNode(selection.selectedId, { zoom: 1.3, duration: 600 });
    }

    function exitPresentation() {
      presenting = false;
      document.body.classList.remove('is-presenting');
      if (document.fullscreenElement) document.exitFullscreen?.();
    }

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && presenting) exitPresentation();
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && presenting) exitPresentation();
    });

    selection.addEventListener('change', (e) => {
      if (e.detail?.editingChanged) render();
      else canvas.updateSelectionClasses();
      outlineController?.render();
      if (presenting && selection.selectedId) canvas.centerOnNode(selection.selectedId, { zoom: 1.3, duration: 450 });
    });

    applyTheme(store.doc.themeMode || 'print');
    selection.select(store.getInitialSelection());

    function resetDocument(doc) {
      fileHandle = null;
      store.replaceDocument(doc);
      history.init(store.doc);
      selection.select(store.getInitialSelection());
      applyTheme(store.doc.themeMode || 'print');
    }

    attachKeyboard(store, selection, {
      undo() {
        const prev = history.undo();
        if (prev) store.replaceDocument(prev);
      },
      redo() {
        const next = history.redo();
        if (next) store.replaceDocument(next);
      },
      async save() {
        fileHandle = await saveDocumentToFile(store.doc, fileHandle);
      },
      flashBlocked(id) {
        canvas.flashBlocked(id);
      },
    });

    createToolbar(document.body, {
      async newFromTemplate() {
        const templates = await loadTemplateIndex();
        const picked = await showTemplateGallery(templates);
        if (!picked) return;
        const doc = await loadTemplateDoc(picked.file);
        resetDocument(doc);
        if (doc.template?.hint) showHint(doc.template.hint);
      },
      async saveAsTemplate() {
        const meta = await showSaveAsTemplateForm({ name: store.doc.meta.title });
        if (!meta) return;
        const templateDoc = buildTemplateDoc(store.doc, meta);
        await saveDocumentToFile(templateDoc, null);
      },
      toggleLock() {
        if (selection.selectedId) store.toggleLock(selection.selectedId);
      },
      switchSide() {
        if (store.doc.type !== 'mindmap') {
          alert('สลับข้างกิ่ง ใช้ได้เฉพาะ mindmap');
          return;
        }
        const id = selection.selectedId;
        if (!id) {
          alert('เลือกกิ่งที่ต้องการย้ายข้าง หรือเลือกหัวข้อหลักเพื่อเพิ่มกิ่งทางซ้าย');
          return;
        }
        const result = switchMindmapSide(store, id);
        if (result?.action === 'added') selection.startEditing(result.id);
      },
      switchListItem() {
        if (store.doc.type !== 'mindmap') {
          alert('ข้อย่อยเรียงลง ใช้ได้เฉพาะ mindmap');
          return;
        }
        const id = selection.selectedId;
        if (!id) {
          alert('เลือกกล่องที่ต้องการทำเป็นข้อย่อยก่อน');
          return;
        }
        if (switchMindmapListItem(store, id) === null) {
          alert('หัวข้อหลักและกิ่งระดับแรกทำเป็นข้อย่อยไม่ได้ — เลือกกล่องที่ลึกกว่านั้น');
        }
      },
      async openFile() {
        try {
          const { doc, handle } = await openDocumentFromFile();
          fileHandle = handle;
          resetDocument(doc);
        } catch (err) {
          console.error(err);
        }
      },
      async save() {
        fileHandle = await saveDocumentToFile(store.doc, fileHandle);
      },
      async exportPng() {
        await exportPngFile(store, `${store.doc.meta.title || 'diagram'}.png`);
      },
      exportSvg() {
        exportSvgFile(canvas.svg, store.doc, `${store.doc.meta.title || 'diagram'}.svg`);
      },
      async exportPdf() {
        await exportPdfFile(store, `${store.doc.meta.title || 'diagram'}.pdf`);
      },
      presentMode() {
        enterPresentation();
      },
      toggleOutline() {
        const ctrl = ensureOutline();
        outlineVisible = !outlineVisible;
        ctrl.panel.style.display = outlineVisible ? 'flex' : 'none';
        if (outlineVisible) ctrl.render();
      },
      async search() {
        const id = await showSearchDialog(store);
        if (id) {
          selection.select(id);
          canvas.centerOnNode(id, { zoom: 1.3, duration: 500 });
        }
      },
      async exportHtml() {
        await exportInteractiveHtml(store, `${store.doc.meta.title || 'diagram'}.html`);
      },
      async copyImage() {
        try {
          await copyDiagramToClipboard(store);
        } catch (err) {
          alert(`คัดลอกภาพไม่สำเร็จ: ${err.message}`);
        }
      },
      toggleTheme() {
        const next = store.doc.themeMode === 'print' ? 'screen' : 'print';
        store.setThemeMode(next);
        applyTheme(next);
      },
      undo() {
        const prev = history.undo();
        if (prev) store.replaceDocument(prev);
      },
      redo() {
        const next = history.redo();
        if (next) store.replaceDocument(next);
      },
    });

    render();
  </script>
</body>
</html>
