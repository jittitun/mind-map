<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diagram+</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--color-background, #040f1c);
      color: var(--color-text, #ffffff);
      font-family: var(--font-body, sans-serif);
    }

    #app { position: relative; height: 100%; }
    #diagram-canvas { position: absolute; inset: 0; }
    #diagram-canvas svg { cursor: grab; }

    .dp-toolbar {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-width: calc(100vw - 24px);
      background: var(--color-surface, #071d33);
      padding: 6px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }
    .dp-toolbar button {
      font-family: var(--font-body);
      background: transparent;
      color: var(--color-text, #fff);
      border: 1px solid var(--color-line, #5c7a9e);
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 13px;
    }
    .dp-toolbar button:hover { background: var(--color-accent, #c9a227); color: #111; }

    .dp-node rect {
      fill: var(--color-surface, #071d33);
      stroke: var(--color-line, #5c7a9e);
      stroke-width: 1.5px;
    }
    .dp-node text {
      fill: var(--color-text, #fff);
      font-family: var(--font-body);
      font-size: 16px;
      user-select: none;
    }
    .dp-node.is-selected rect { stroke: var(--color-accent, #c9a227); stroke-width: 3px; }
    .dp-node.is-locked rect { stroke-dasharray: 4 3; }
    .dp-node.is-dragging { opacity: 0.6; cursor: grabbing; }
    .dp-node.is-drop-target rect { stroke: var(--color-accent, #c9a227); stroke-width: 3px; }
    .dp-node.is-blocked rect { stroke: #e05252; stroke-width: 3px; transition: stroke 0.1s; }
    .dp-node.is-root rect { stroke-width: 2.5px; }
    .dp-node.is-header rect { fill: var(--color-accent, #c9a227); stroke: none; }
    .dp-node.is-header text { fill: #111; font-weight: 600; }
    .dp-toggle { fill: var(--color-accent, #c9a227); cursor: pointer; }
    .dp-edge { fill: none; stroke: var(--color-line, #5c7a9e); stroke-width: 2px; }
    .dp-edge.dp-spine { stroke-width: 3px; }
    .dp-edge.dp-link { stroke: var(--color-accent, #c9a227); marker-end: url(#dp-arrowhead); }

    .dp-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .dp-modal {
      background: var(--color-surface, #071d33);
      color: var(--color-text, #fff);
      font-family: var(--font-body);
      border-radius: 10px;
      padding: 20px;
      width: min(420px, 90vw);
      max-height: 80vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .dp-modal h2 { margin: 0 0 4px; font-size: 16px; }
    .dp-modal label { font-size: 13px; display: block; }
    .dp-modal input, .dp-modal textarea {
      width: 100%;
      box-sizing: border-box;
      margin-top: 4px;
      background: var(--color-background, #040f1c);
      color: var(--color-text, #fff);
      border: 1px solid var(--color-line, #5c7a9e);
      border-radius: 6px;
      padding: 6px 8px;
      font-family: var(--font-body);
      font-size: 13px;
    }
    .dp-modal-list { display: flex; flex-direction: column; gap: 6px; }
    .dp-modal-item {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      text-align: left;
      background: var(--color-background, #040f1c);
      color: var(--color-text, #fff);
      border: 1px solid var(--color-line, #5c7a9e);
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
      font-family: var(--font-body);
    }
    .dp-modal-item:hover { border-color: var(--color-accent, #c9a227); }
    .dp-modal-item span { font-size: 12px; opacity: 0.8; }
    .dp-modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .dp-modal button, .dp-modal-cancel {
      font-family: var(--font-body);
      background: transparent;
      color: var(--color-text, #fff);
      border: 1px solid var(--color-line, #5c7a9e);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    .dp-modal-actions button:last-child { background: var(--color-accent, #c9a227); color: #111; border-color: transparent; }

    .dp-node-edit {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      outline: none;
      border: none;
      background: var(--color-background, #040f1c);
      color: var(--color-text, #fff);
      font-family: var(--font-body);
      font-size: 16px;
      padding: 4px 8px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import {
      DocumentStore,
      createEmptyMindmap,
      getRecentList,
      loadFromLocalStorage,
      saveToLocalStorage,
      saveDocumentToFile,
      openDocumentFromFile,
    } from './src/core/store.js';
    import { History } from './src/core/history.js';
    import { Selection } from './src/core/selection.js';
    import { Canvas } from './src/core/canvas.js';
    import { attachKeyboard } from './src/core/keyboard.js';
    import { createToolbar } from './src/ui/toolbar.js';
    import { applyTheme } from './src/ui/theme.js';
    import { showTemplateGallery, showSaveAsTemplateForm, showHint } from './src/ui/dialogs.js';
    import { loadTemplateIndex, loadTemplateDoc, buildTemplateDoc } from './src/ui/templates.js';
    import { exportPngFile, exportSvgFile } from './src/export/png.js';
    import { copyDiagramToClipboard } from './src/export/clipboard.js';

    const appEl = document.getElementById('app');
    const canvasHost = document.createElement('div');
    canvasHost.id = 'diagram-canvas';
    appEl.appendChild(canvasHost);

    async function loadInitialDocument() {
      const recent = getRecentList();
      if (recent[0]) {
        const doc = loadFromLocalStorage(recent[0].id);
        if (doc) return doc;
      }
      try {
        return await loadTemplateDoc('mindmap-empty.json');
      } catch {
        return createEmptyMindmap();
      }
    }

    const initialDoc = await loadInitialDocument();
    const store = new DocumentStore(initialDoc);
    const selection = new Selection();
    const history = new History(200);
    history.init(store.doc);

    let fileHandle = null;

    const canvas = new Canvas(canvasHost, store, selection, {
      moveNode: (id, parentId) => store.moveNode(id, parentId),
      startEdit: (id) => selection.startEditing(id),
    });

    function render() {
      canvas.render();
    }

    store.addEventListener('change', (e) => {
      saveToLocalStorage(store.doc);
      render();
      if (!e.detail?.silent) history.record(store.doc);
    });
    selection.addEventListener('change', render);

    applyTheme(store.doc.themeMode || 'screen');
    selection.select(store.getInitialSelection());

    function resetDocument(doc) {
      fileHandle = null;
      store.replaceDocument(doc);
      history.init(store.doc);
      selection.select(store.getInitialSelection());
      applyTheme(store.doc.themeMode || 'screen');
    }

    attachKeyboard(store, selection, {
      undo() {
        const prev = history.undo();
        if (prev) store.replaceDocument(prev);
      },
      redo() {
        const next = history.redo();
        if (next) store.replaceDocument(next);
      },
      async save() {
        fileHandle = await saveDocumentToFile(store.doc, fileHandle);
      },
      flashBlocked(id) {
        canvas.flashBlocked(id);
      },
    });

    createToolbar(document.body, {
      async newFromTemplate() {
        const templates = await loadTemplateIndex();
        const picked = await showTemplateGallery(templates);
        if (!picked) return;
        const doc = await loadTemplateDoc(picked.file);
        resetDocument(doc);
        if (doc.template?.hint) showHint(doc.template.hint);
      },
      async saveAsTemplate() {
        const meta = await showSaveAsTemplateForm({ name: store.doc.meta.title });
        if (!meta) return;
        const templateDoc = buildTemplateDoc(store.doc, meta);
        await saveDocumentToFile(templateDoc, null);
      },
      toggleLock() {
        if (selection.selectedId) store.toggleLock(selection.selectedId);
      },
      async openFile() {
        try {
          const { doc, handle } = await openDocumentFromFile();
          fileHandle = handle;
          resetDocument(doc);
        } catch (err) {
          console.error(err);
        }
      },
      async save() {
        fileHandle = await saveDocumentToFile(store.doc, fileHandle);
      },
      async exportPng() {
        await exportPngFile(store, `${store.doc.meta.title || 'diagram'}.png`);
      },
      exportSvg() {
        exportSvgFile(canvas.svg, store.doc, `${store.doc.meta.title || 'diagram'}.svg`);
      },
      async copyImage() {
        try {
          await copyDiagramToClipboard(store);
        } catch (err) {
          alert(`คัดลอกภาพไม่สำเร็จ: ${err.message}`);
        }
      },
      toggleTheme() {
        const next = store.doc.themeMode === 'print' ? 'screen' : 'print';
        store.setThemeMode(next);
        applyTheme(next);
      },
      undo() {
        const prev = history.undo();
        if (prev) store.replaceDocument(prev);
      },
      redo() {
        const next = history.redo();
        if (next) store.replaceDocument(next);
      },
    });

    render();
  </script>
</body>
</html>
